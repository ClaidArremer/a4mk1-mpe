# The MIDI task (0x4006385a) dispatches each message through 16 handler pointers
# indexed by status >> 4 at 0x4017b598. Five of them now go to 0013, which falls
# back to the stock handler for anything that is not MPE.
[[patch]]
owner       = "0013-mpe"
addr        = 0x4017b5b8
size        = 4
expect      = "40064ede"
from_symbol = "mpe_note_off"

[[patch]]
owner       = "0013-mpe"
addr        = 0x4017b5bc
size        = 4
expect      = "400652ae"
from_symbol = "mpe_note_on"

[[patch]]
owner       = "0013-mpe"
addr        = 0x4017b5c4
size        = 4
expect      = "40063cee"
from_symbol = "mpe_cc"

[[patch]]
owner       = "0013-mpe"
addr        = 0x4017b5cc
size        = 4
expect      = "40063e48"
from_symbol = "mpe_pressure"

[[patch]]
owner       = "0013-mpe"
addr        = 0x4017b5d0
size        = 4
expect      = "40063f54"
from_symbol = "mpe_bend"

# The engine's modulation loop: movea.l %d5,%a1 / addq.l #4,%d6 / move.l (%a0)+,%d2
# at 0x400fd164 becomes jsr mpe_loop_hook (which does all three).
[[patch]]
owner   = "0013-mpe"
addr    = 0x400fd164
size    = 2
expect  = "2245"
replace = "4eb9"

[[patch]]
owner       = "0013-mpe"
addr        = 0x400fd166
size        = 4
expect      = "58862418"
from_symbol = "mpe_loop_hook"

# The engine's note start calls the poly allocator 0x400ff284 at 0x400fc4a4
# (jsr abs.l); its target becomes mpe_alloc, which calls the stock one unless the
# note came from a member channel.
[[patch]]
owner       = "0013-mpe"
addr        = 0x400fc4a6
size        = 4
expect      = "400ff284"
from_symbol = "mpe_alloc"

