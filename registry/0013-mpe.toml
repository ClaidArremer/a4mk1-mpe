# ---------------------------------------------------------------- 0013-mpe
# Space: the regions 0010 / 0012 claim (0013 excludes both). Code only; its state is
# in free DDR at 0x4680e000 (0x200 B, between 0011's SNAP, which ends 0x46808d2c, and
# 0007's buffers at 0x4680c000 / HOLD .. 0x4680c220 - it is above them, below
# 0x4680ffff), initialised on first use behind a magic word.

[[cave]]
owner   = "0013-mpe"
addr    = 0x401eeb08
size    = 0x1f4
section = ".mpe1"
note    = "State, the zone tests, the engine-loop hook and mpe_voice_index (cave3)."

[[cave]]
owner   = "0013-mpe"
addr    = 0x401eecfc
size    = 0x120
section = ".mpe7"
note    = "mpe_alloc: the poly allocator wrapper (cave3)."

